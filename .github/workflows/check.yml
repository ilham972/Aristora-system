# A one-off probe (9 Nov 2026, the auth:me "Server Error"): asks the live server a few read-only questions with no
# sign-in and writes what it answered to ci-report/probe.txt on this branch. Never on main.
name: check

on:
  push:
    branches: ["ci-probe"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: bash
        run: |
          mkdir -p ci-report
          U=https://qualified-fish-602.convex.cloud
          {
            date -u
            echo "== GET /version"; curl -sS -m 20 "$U/version" -w '\nHTTP %{http_code}\n'
            for body in \
              '{"path":"auth:me","args":{},"format":"json"}' \
              '{"path":"auth:me","args":{"token":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"},"format":"json"}' \
              '{"path":"auth:peekLink","args":{"code":"abcdefghijklmnopqrstuvwxyz"},"format":"json"}' \
              '{"path":"state:get","args":{},"format":"json"}' \
              '{"path":"family:me","args":{},"format":"json"}'; do
              echo "== POST /api/query $body"
              curl -sS -m 30 -X POST "$U/api/query" -H 'Content-Type: application/json' -d "$body" -w '\nHTTP %{http_code} in %{time_total}s\n'
            done
          } > ci-report/probe.txt 2>&1
          cat ci-report/probe.txt
          git config user.name "aristora-check"
          git config user.email "aristora-check@users.noreply.github.com"
          git add -f ci-report
          git commit -m "Probe report" -q
          git push origin HEAD:${{ github.ref_name }}

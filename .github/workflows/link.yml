# The Claude link's carrier (10 Nov 2026; convex/link.ts). A Claude chat can't reach the app (its machine only reaches
# GitHub), so it pushes its requests onto a branch "link-…" and this job carries each one to the app and writes the
# answer back onto the branch (link/got/). Every request and answer is sealed with the link's key, which only the
# app's database and the owner's chat hold (convex/lib/seal.ts): this job, its log and the branch never see a word of
# a book. It installs nothing and never runs on main. Vercel never builds "link-…" (vercel.json).
name: link

on:
  push:
    branches: ["link-*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  carry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONVEX_URL: https://qualified-fish-602.convex.cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Carry the requests to the app
        run: node scripts/link-relay.mjs

      - name: Answers back onto the branch
        if: always()
        shell: bash
        run: |
          git config user.name "aristora-link"
          git config user.email "aristora-link@users.noreply.github.com"
          git add -f link/got
          git commit -m "Answers for ${GITHUB_SHA::7}" -q
          git push origin HEAD:${{ github.ref_name }}
